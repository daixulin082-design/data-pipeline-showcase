<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商户名录采集 Demo · 数据采集与清洗</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--line:#e5e4e0;--line2:#d5d4cf;--ink:#1a1a18;--ink2:#4a4a46;
  --muted:#8a8a84;--accent:#2f6f4e;--accent2:#e8f0eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.7 Inter,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:0;line-break:strict}
header{padding:28px 32px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px}
.sub b{color:var(--accent);font-weight:600}
main{padding:20px 32px 60px;max-width:1400px;margin:0 auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input,button{font:inherit;font-size:13px}
select,input[type=text]{padding:7px 10px;border:1px solid var(--line2);border-radius:5px;background:#fff;outline:none;color:var(--ink)}
select:focus,input:focus{border-color:var(--accent)}
input[type=text]{flex:1 1 240px;min-width:180px}
.btn{padding:7px 14px;border:1px solid var(--line2);border-radius:5px;background:#fff;cursor:pointer;color:var(--ink2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.stat{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{text-align:left;padding:11px 14px;font-size:11.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;background:#fbfbfa;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fbfbfa}
td.num{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
td.name{color:var(--ink);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;
  font-family:ui-monospace,monospace;background:var(--accent2);color:var(--accent)}
.mask{color:var(--muted);font-family:ui-monospace,monospace;font-size:12px}
.empty{padding:60px;text-align:center;color:var(--muted)}
footer{margin-top:24px;padding:16px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.9}
footer a{color:var(--accent)}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:3px;font-size:11px;
  background:#eef4f0;color:var(--accent);border:1px solid #cfe2d8}
@media(max-width:760px){
  header,main{padding-left:16px;padding-right:16px}
  th:nth-child(4),td:nth-child(4),th:nth-child(8),td:nth-child(8){display:none}
}
</style>
</head>
<body>
<header>
  <h1>商户名录采集 Demo</h1>
  <div class="sub">演示数据为程序生成的虚构样例 · 实际交付为 Excel/CSV + 可复跑的采集源码 · <b>字段按需定制</b><span class="badge">技术演示</span></div>
</header>
<main>
  <div class="filters">
    <select id="fCity"><option value="">全部城市</option></select>
    <select id="fArea"><option value="">全部区域</option></select>
    <select id="fCat">
      <option value="">全部品类</option>
      <option value="餐饮">餐饮</option>
      <option value="咖啡">咖啡</option>
      <option value="美容">美容</option>
      <option value="健身">健身</option>
      <option value="维修">维修</option>
      <option value="家政">家政</option>
    </select>
    <select id="fPrice">
      <option value="">全部客单价</option>
      <option value="0-80">80 以下</option>
      <option value="80-150">80–150</option>
      <option value="150-300">150–300</option>
      <option value="300-99999">300 以上</option>
    </select>
    <input type="text" id="q" placeholder="搜索名称 / 商圈 / 标签…">
    <button class="btn" id="reset">重置</button>
    <span class="stat" id="stat"></span>
  </div>
  <table>
    <thead><tr>
      <th>ID</th><th>采集时间</th><th>城市</th><th>区域</th><th>商户名称</th>
      <th>品类</th><th>客单价</th><th>评分</th><th>联系方式</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">没有匹配的记录</div>

  <footer>
    这是「网页采集 → 数据清洗 → 结构化交付」流水线的前端演示。<br>
    实际交付包含：结构化数据文件（Excel / CSV / JSON）+ 可复跑的 Python 采集源码 + 使用说明。<br>
    全部数据为程序生成的虚构样例，仅用于展示字段结构与筛选能力 · <a href="/quote.html">报价计算器</a><br>业务咨询：<b>微信 15317124739</b> · 邮箱 daixulin082@gmail.com
  </footer>
</main>

<script>
/* ===== 虚构样例：本地生活商户名录 ===== */
var CITIES = {
  "杭州": ["上城区","拱墅区","西湖区","滨江区","萧山区","余杭区"],
  "南京": ["玄武区","秦淮区","建邺区","鼓楼区","江宁区","浦口区"],
  "苏州": ["姑苏区","吴中区","相城区","工业园区","高新区"],
  "上海": ["黄浦区","徐汇区","静安区","普陀区","浦东新区","闵行区"],
  "无锡": ["梁溪区","滨湖区","新吴区","惠山区"],
  "常州": ["天宁区","钟楼区","新北区","武进区"]
};
var CATS = ["餐饮","咖啡","美容","健身","维修","家政"];
var BRANDS = ["禾","拾","原","朴","一","南","青","和","初","小"];
var SUFFIX = {
  "餐饮": ["家常菜馆","面馆","烧烤店","私房菜","小酒馆"],
  "咖啡": ["咖啡工作室","手冲咖啡馆","烘焙坊","茶饮店"],
  "美容": ["美容工作室","皮肤管理中心","美甲店","造型工作室"],
  "健身": ["健身工作室","私教馆","瑜伽馆","搏击俱乐部"],
  "维修": ["汽车维修店","家电维修点","手机维修店","开锁服务"],
  "家政": ["家政服务部","保洁工作室","月嫂服务","搬家服务"]
};
var AREAS_TAG = ["近地铁","临街店铺","商场内","写字楼底商","社区商铺","老字号"];
var NOTE = ["已核验","连锁门店","个体经营","新开业","高评分","暂无评价"];

function pad(n){return n<10?"0"+n:n}
function masked(s){return s.slice(0,3) + "****" + s.slice(-2)}

var DATA = (function(){
  var out = [], seed = 20261116;
  function rnd(){ seed = (seed*9301+49297) % 233280; return seed/233280; }
  var cities = Object.keys(CITIES);
  for (var i=0;i<200;i++){
    var c = cities[Math.floor(rnd()*cities.length)];
    var areas = CITIES[c];
    var a = areas[Math.floor(rnd()*areas.length)];
    var cat = CATS[Math.floor(rnd()*CATS.length)];
    var name = BRANDS[Math.floor(rnd()*BRANDS.length)]
             + (SUFFIX[cat][Math.floor(rnd()*SUFFIX[cat].length)]);
    var price = [45,68,88,120,168,220,280,380][Math.floor(rnd()*8)];
    var score = (3.5 + rnd()*1.5).toFixed(1);
    var m = Math.floor(rnd()*10)+1, d = Math.floor(rnd()*28)+1;
    var tel = "0" + String(Math.floor(10+rnd()*89)) + "-" + String(Math.floor(1000000+rnd()*8999999));
    var mob = "1" + [3,5,7,8,9][Math.floor(rnd()*5)] + String(Math.floor(100000000+rnd()*899999999));
    out.push({
      id: "M" + pad(i+1),
      date: "2026-11-" + pad(m) + " " + pad(d),
      city: c, area: a, cat: cat, name: name,
      price: price, score: score, tel: tel, mob: mob,
      tag: AREAS_TAG[Math.floor(rnd()*AREAS_TAG.length)],
      note: NOTE[Math.floor(rnd()*NOTE.length)]
    });
  }
  return out;
})();

var F = { city:"", area:"", cat:"", price:"", q:"" };

function inRange(v, r){
  var p = r.split("-").map(Number);
  return v >= p[0] && v < p[1];
}

function match(r){
  if (F.city && r.city !== F.city) return false;
  if (F.area && r.area !== F.area) return false;
  if (F.cat && r.cat !== F.cat) return false;
  if (F.price && !inRange(r.price, F.price)) return false;
  if (F.q){
    var blob = (r.name + r.area + r.city + r.tag + r.note).toLowerCase();
    if (blob.indexOf(F.q.toLowerCase()) < 0) return false;
  }
  return true;
}

function render(){
  var rows = DATA.filter(match);
  document.getElementById("tbody").innerHTML = rows.map(function(r){
    return "<tr>" +
      "<td class='num'>" + r.id + "</td>" +
      "<td class='num'>" + r.date + "</td>" +
      "<td>" + r.city + "</td>" +
      "<td>" + r.area + "</td>" +
      "<td class='name'>" + r.name + " <span class='tag'>" + r.tag + "</span></td>" +
      "<td>" + r.cat + "</td>" +
      "<td class='num'>¥" + r.price + "</td>" +
      "<td class='num'>" + r.score + "</td>" +
      "<td class='mask'>" + masked(r.tel) + " · " + masked(r.mob) + "</td>" +
    "</tr>";
  }).join("");
  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  document.getElementById("stat").textContent = rows.length + " / " + DATA.length + " 条";
}

(function init(){
  var fc = document.getElementById("fCity");
  Object.keys(CITIES).forEach(function(c){
    var o = document.createElement("option"); o.value = c; o.textContent = c; fc.appendChild(o);
  });

  fc.onchange = function(){
    F.city = this.value; F.area = "";
    var fa = document.getElementById("fArea");
    fa.innerHTML = '<option value="">全部区域</option>';
    if (F.city){
      CITIES[F.city].forEach(function(a){
        var o = document.createElement("option"); o.value = a; o.textContent = a; fa.appendChild(o);
      });
    }
    render();
  };
  document.getElementById("fArea").onchange = function(){ F.area = this.value; render(); };
  document.getElementById("fCat").onchange = function(){ F.cat = this.value; render(); };
  document.getElementById("fPrice").onchange = function(){ F.price = this.value; render(); };
  document.getElementById("q").oninput = function(){ F.q = this.value.trim(); render(); };
  document.getElementById("reset").onclick = function(){
    F = { city:"", area:"", cat:"", price:"", q:"" };
    document.getElementById("fCity").value = "";
    document.getElementById("fArea").innerHTML = '<option value="">全部区域</option>';
    document.getElementById("fCat").value = "";
    document.getElementById("fPrice").value = "";
    document.getElementById("q").value = "";
    render();
  };
  render();
})();
</script>
</body>
</html>
